group 'com.google_mlkit_image_labeling'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.google_mlkit_image_labeling'
    }
    
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
    }
}

dependencies {
    implementation 'com.google.mlkit:image-labeling:17.0.9'
    implementation 'com.google.mlkit:image-labeling-custom:17.0.3'
    implementation('com.google.mlkit:linkfirebase:17.0.0') {
        // linkfirebase is legacy and still pulls firebase-iid 20.1.5, whose
        // receiver is also bundled by modern firebase-messaging/OneSignal.
        // InnerU only uses the on-device base labeler, so the obsolete IID
        // transport is neither needed nor safe on the runtime classpath.
        exclude group: 'com.google.firebase', module: 'firebase-iid'
    }
}
